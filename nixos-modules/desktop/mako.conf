font=Fira Code 11
background-color=#20242DF2
text-color=#D8DEE9FF
width=300
height=64
outer-margin=14
margin=6
padding=9,12
border-size=2
border-color=#5E81ACFF
border-radius=8
progress-color=over #5E81ACCC
icons=1
icon-path=@adwaita_icons@:@gnome_icons@:/run/current-system/sw/share/icons/hicolor:/run/current-system/sw/share/pixmaps
icon-location=left
max-icon-size=42
icon-border-radius=6
markup=1
actions=1
format=<span weight="bold" foreground="#ECEFF4">%s</span>\n<span foreground="#D8DEE9">%b</span>
default-timeout=5000
group-by=app-name,summary
max-visible=4
layer=overlay
anchor=top-right

[urgency=low]
border-color=#A3BE8CFF
progress-color=over #A3BE8CCC

[urgency=normal]
border-color=#5E81ACFF
progress-color=over #5E81ACCC

[body=""]
height=42
padding=7,12
format=<span weight="bold" foreground="#ECEFF4">%s</span>

[app-name="JohnOS Audio"]
width=360
height=84
padding=12,14
border-size=2
border-color=#88C0D0FF
progress-color=over #88C0D0D9
format=<span weight="bold" foreground="#ECEFF4">%s</span>\n<span foreground="#C8D8EA">%b</span>

[app-name="JohnOS Audio" summary="Volume up"]
border-color=#A3BE8CFF
progress-color=over #A3BE8CE6

[app-name="JohnOS Audio" summary="Volume down"]
border-color=#88C0D0FF
progress-color=over #88C0D0D9

[app-name="JohnOS Audio" summary="Muted"]
background-color=#251E2EF7
border-color=#B48EADFF
progress-color=over #B48EADE6

[app-name="JohnOS Audio" summary="Unmuted"]
border-color=#EBCB8BFF
progress-color=over #EBCB8BE6

[app-name="JohnOS Brightness"]
width=360
height=84
padding=12,14
border-size=2
border-color=#EBCB8BFF
progress-color=over #EBCB8BE6
format=<span weight="bold" foreground="#ECEFF4">%s</span>\n<span foreground="#F2DCA8">%b</span>

[app-name="JohnOS Brightness" summary="Brightness up"]
border-color=#EBCB8BFF
progress-color=over #EBCB8BE6

[app-name="JohnOS Brightness" summary="Brightness down"]
border-color=#B48EADFF
progress-color=over #B48EADE6

[urgency=critical]
background-color=#2E1F2CF7
text-color=#ECEFF4FF
border-color=#BF616AFF
progress-color=over #BF616ACC
default-timeout=0
